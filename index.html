<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#0b0f14">
    <meta name="description" content="ATLAS Enterprise - Demo Version">
    <link rel="manifest" href="manifest.json">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg">
    <link rel="apple-touch-icon" href="icons/icon-512.svg">
    
    <link rel="stylesheet" href="styles/themes.css">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/css-fixes.css">
    <link rel="stylesheet" href="styles/boot-screen.css">
    <link rel="stylesheet" href="styles/atlas-components.css">
    <link rel="stylesheet" href="styles/additional.css">
    <link rel="stylesheet" href="styles/modal.css">
    <link rel="stylesheet" href="styles/premium.css">
    <link rel="stylesheet" href="styles/components-v4.css">
    <link rel="stylesheet" href="styles/print.css" media="print">
    
    <style>
        /* Demo Banner */
        .demo-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(90deg, #6b9ebe, #8b9dc7);
            color: #fff;
            text-align: center;
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            z-index: 10001;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .demo-banner a {
            color: #fff;
            text-decoration: underline;
        }
        .demo-banner .demo-close {
            position: absolute;
            right: 16px;
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 1.2rem;
            opacity: 0.8;
        }
        .demo-banner .demo-close:hover {
            opacity: 1;
        }
        body.has-demo-banner .app {
            padding-top: 40px;
        }
        body.has-demo-banner .sidebar {
            top: 40px;
            height: calc(100vh - 40px);
        }
        
        /* Demo Workspace Badge */
        .demo-badge {
            background: rgba(107, 158, 190, 0.2);
            color: var(--accent);
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 8px;
            letter-spacing: 0.5px;
        }
        
        /* Demo Workspace Selector */
        .demo-workspace {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }
        .demo-workspace .workspace-current {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .demo-workspace .workspace-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
            font-size: 0.9rem;
        }
        .demo-workspace .workspace-name {
            font-weight: 600;
            color: var(--text);
        }
    </style>
    
    <title>ATLAS Demo</title>
</head>
<body class="has-demo-banner">
    <!-- Demo Banner -->
    <div class="demo-banner" id="demoBanner">
        <span>🚀 ATLAS Demo — Versão de demonstração para portfólio</span>
        <a href="https://github.com/seu-usuario/atlas" target="_blank">Ver no GitHub</a>
        <button class="demo-close" onclick="document.getElementById('demoBanner').style.display='none'; document.body.classList.remove('has-demo-banner');">×</button>
    </div>

    <!-- Boot Screen -->
    <div id="bootScreen" class="boot-screen">
        <div class="boot-content">
            <img src="assets/atlas-logo-full.png" alt="ATLAS Enterprise" class="boot-logo">
            <div class="boot-loader"><div class="boot-progress"></div></div>
            <div class="boot-text">Inicializando Demo...</div>
        </div>
    </div>

    <!-- Main App -->
    <div class="app" id="app" style="display: none;">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <img src="assets/atlas-logo.png" alt="ATLAS" class="logo-icon">
                    <div class="logo-text">
                        <span class="logo-title">ATLAS</span>
                        <span class="logo-subtitle">Demo</span>
                    </div>
                </div>
            </div>
            <div id="workspaceSelector"></div>
            <nav class="sidebar-nav" id="nav"></nav>
            <div class="sidebar-footer">ATLAS Lite v5.0</div>
        </aside>
        <main class="main">
            <header class="header" id="header"></header>
            <div class="content" id="content"></div>
        </main>
    </div>
    
    <div id="atlasModalRoot"></div>

    <!-- ============================================
         SCRIPTS - Demo Version
         ============================================ -->
    
    <!-- 1. Core -->
    <script src="scripts/core/capabilities.js"></script>
    
    <!-- 2. State (sem persistência) -->
    <script src="scripts/state.js"></script>
    
    <!-- 3. UI Core -->
    <script src="scripts/router.js"></script>
    <script src="scripts/modal.js"></script>
    
    <!-- 4. Workspace (demo fixo) -->
    <script src="scripts/workspace.js"></script>
    
    <!-- 5. Main -->
    <script src="scripts/main.js"></script>
    
    <!-- 6. Modules -->
    <script src="scripts/modules/dashboard.js"></script>
    <script src="scripts/modules/finance.js"></script>
    <script src="scripts/modules/fire.js"></script>
    <script src="scripts/modules/compare.js"></script>
    <script src="scripts/modules/simulations.js"></script>
    <script src="scripts/modules/scenarios.js"></script>
    <script src="scripts/modules/goals.js"></script>
    
    <!-- 7. Analytics -->
    <script src="scripts/analytics/atlas-index.js"></script>
    
    <!-- 8. WASM (Monte Carlo) -->
    <script src="scripts/wasm/wasm-loader.js"></script>
    
    <!-- 9. Boot -->
    <script src="scripts/boot.js"></script>

</body>
</html>
